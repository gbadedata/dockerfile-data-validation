[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvgate"
version = "1.0.0"
description = "Validation gates for datasets, schemas and model artefacts inside Docker builds"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Oluwagbade Odimayo" }]
dependencies = ["numpy>=2.0", "pandas>=2.2", "PyYAML>=6.0"]

[project.optional-dependencies]
train = ["scikit-learn>=1.5"]
dev = ["pytest>=8", "ruff>=0.6", "scikit-learn>=1.5"]

[project.scripts]
dvgate = "dvgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
